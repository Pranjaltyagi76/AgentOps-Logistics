name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, migrations, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops_ci
          POSTGRES_DB: agentops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentops -d agentops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://agentops:agentops_ci@localhost:5432/agentops
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../scripts
      - name: Format check
        run: uv run ruff format --check . ../scripts
      - name: Validate scenario files
        run: uv run python ../scripts/validate_scenarios.py
      - name: OpenAPI schema is up to date (frontend/openapi.json)
        run: uv run python ../scripts/export_openapi.py --check
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest
      # After the tests (which expect an empty database): seed twice to prove it is idempotent.
      - name: Seed scenarios (twice)
        run: |
          uv run python ../scripts/seed_db.py
          uv run python ../scripts/seed_db.py | tee seed-second-run.txt
          ! grep -E "^(created|updated|error) " seed-second-run.txt

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Generated API types are up to date (src/lib/api-schema.ts)
        run: |
          npm ci --prefix tools/openapi
          npm run gen:api
          git diff --exit-code -- src/lib/api-schema.ts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker image (build, boot, smoke test, restart)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops_ci
          POSTGRES_DB: agentops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentops -d agentops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image (context = repository root)
        run: docker build -f backend/Dockerfile -t agentops-api .
      - name: The image contains no .env file
        run: docker run --rm --entrypoint sh agentops-api -c '! ls -a /app/backend /app | grep -x ".env"'
      - name: Boot it (migrate, seed, create owner, serve)
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+psycopg://agentops:agentops_ci@localhost:5432/agentops \
            -e JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e CORS_ORIGINS=http://localhost:5173 \
            -e GIT_SHA=${{ github.sha }} \
            -e OWNER_EMAIL=ci-owner@example.com \
            -e OWNER_PASSWORD=ci-only-owner-password-123 \
            agentops-api
      - name: Smoke test
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py --api http://localhost:8000 \
            --expect-sha ${{ github.sha }} --wake-timeout 180 | tee smoke.txt
          grep -q "^RUN_ID=" smoke.txt
      - name: Restart, then the run, trace and score are still there
        run: |
          docker restart api
          python3 scripts/smoke_test.py --api http://localhost:8000 --wake-timeout 180 \
            --after-restart "$(sed -n 's/^RUN_ID=//p' smoke.txt)"
      - name: Memory use (Render free instances have 512 MB)
        run: docker stats --no-stream --format "{{.Name}} {{.MemUsage}}" api
      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -n 80

